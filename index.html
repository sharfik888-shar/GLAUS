<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLAUS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path fill='%233d9bff' d='M58 8L6 29l16 6 6 18 8-10 14 10z'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0e1621;--card:#17212b;--line:#243447;--ac:#3d9bff;--tx:#fff;--mu:#8b9bb0;--err:#ff5d6c;--me:#2b5278}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;height:100dvh;overflow:hidden}
button{border:0;font:inherit;color:inherit;background:none;cursor:pointer}
input{width:100%;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--tx);font-size:16px;outline:none}
input:focus{border-color:var(--ac)}
.screen{display:none;height:100dvh;flex-direction:column}
.screen.active{display:flex}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.main{width:100%;padding:14px;border-radius:14px;background:var(--ac);color:#fff;font-weight:600}
.link{width:100%;padding:12px;color:var(--ac)}
.empty{padding:32px 24px;text-align:center;color:var(--mu)}
#auth{align-items:center;justify-content:center;padding:24px;overflow:auto}
.logo{width:96px;height:96px;filter:drop-shadow(0 0 24px rgba(61,155,255,.6))}
h1{letter-spacing:6px;margin:16px 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.box{width:100%;max-width:360px}
.field{position:relative;margin-bottom:12px}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mu)}
.field input{padding-left:44px}
.msg{min-height:20px;color:var(--err);font-size:14px;text-align:center;margin:8px 0}
.top{padding:14px 16px;font-weight:700;font-size:20px;letter-spacing:3px;border-bottom:1px solid var(--line)}
.view{display:none;flex:1;overflow:auto}
.view.active{display:block}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:var(--card)}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:linear-gradient(135deg,#6cc2ff,#2f7bff);flex:none}
.av.big{width:84px;height:84px;font-size:34px;margin:0 auto 10px}
.rt{min-width:0}
.nm{font-weight:600}
.ls{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{padding:16px}
.pad>*{margin-bottom:12px}
.prof{text-align:center}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:10px 0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.nav button.on{color:var(--ac)}
.ok{color:var(--ac);text-align:center;min-height:20px}
.vf{display:inline-flex;vertical-align:middle;margin-left:5px}
.head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.head>button{padding:4px;display:flex}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--card);align-self:flex-start;word-break:break-word;position:relative}
.m.me{background:var(--me);align-self:flex-end}
.rc{position:absolute;right:-6px;bottom:-12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 4px;line-height:0}
.pick{display:flex;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;align-self:center;margin:6px 0}
.bar{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.send{width:48px;flex:none;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="screen active" id="auth">
  <svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cc2ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs><path d="M58 8L6 29l16 6 6 18 8-10 14 10z" fill="url(#pg)"/><path d="M22 35l36-27-28 33z" fill="#fff" opacity=".35"/></svg>
  <h1>GLAUS</h1>
  <p class="sub">Общайся без границ</p>
  <div class="box">
    <div class="field" id="nickField">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <input id="nickname" placeholder="Никнейм (как тебя видят)" maxlength="30">
    </div>
    <div class="field">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.5 7"/></svg>
      <input id="username" placeholder="Юзернейм (латиницей)" maxlength="20" autocapitalize="none" autocomplete="username">
    </div>
    <div class="field">
      <svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="password" type="password" placeholder="Пароль (от 6 символов)">
    </div>
    <div class="field" id="emailField">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <input id="email" type="email" placeholder="Почта (по желанию)">
    </div>
    <div class="field" id="phoneField">
      <svg class="i" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      <input id="phone" type="tel" placeholder="Номер телефона (по желанию)">
    </div>
    <div class="msg" id="msg"></div>
    <button class="main" id="submitBtn" onclick="submit()">Войти</button>
    <button class="link" id="toggleBtn" onclick="setMode(!registerMode)"></button>
  </div>
</div>

<div class="screen" id="app">
  <div class="top">GLAUS</div>
  <div class="view active" id="v-chats"><div id="chatList"></div></div>
  <div class="view" id="v-contacts">
    <div class="pad"><input id="search" placeholder="Поиск по юзернейму" oninput="loadContacts()"></div>
    <div id="contList"></div>
  </div>
  <div class="view" id="v-settings">
    <div class="pad">
      <div class="prof"><div class="av big" id="setAv"></div><div class="nm" id="setName"></div><div class="ls" id="setUser"></div></div>
      <input id="setNick" placeholder="Никнейм" maxlength="30">
      <button class="main" onclick="saveNick()">Сохранить никнейм</button>
      <div class="ok" id="saved"></div>
      <button class="main" id="sndBtn" onclick="toggleSnd()" style="background:var(--card);border:1px solid var(--line)"></button>
      <button class="main" onclick="logout()" style="background:var(--card);border:1px solid var(--line);color:var(--err)">Выйти</button>
    </div>
  </div>
  <div class="nav">
    <button data-t="chats" onclick="tab('chats')"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Чаты</button>
    <button data-t="contacts" onclick="tab('contacts')"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a7 7 0 0 1 4 6"/></svg>Контакты</button>
    <button data-t="settings" onclick="tab('settings')"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки</button>
  </div>
</div>

<div class="screen" id="chat">
  <div class="head">
    <button onclick="closeChat()"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="rt"><div class="nm" id="chName"></div><div class="ls" id="chUser"></div></div>
  </div>
  <div id="msgs"></div>
  <div class="bar">
    <input id="txt" placeholder="Сообщение" autocomplete="off">
    <button class="send" onclick="send()"><svg class="i" viewBox="0 0 24 24"><path d="M21 3L3 11l6 2 2 6 3-4 5 4z"/></svg></button>
  </div>
</div>

<script>
const db = supabase.createClient('https://aqknooffniicmkaldeth.supabase.co', 'sb_publishable_Ge2f924X5ndbYxaeDYN6Kw_KMUeDBxZ');
const $ = id => document.getElementById(id);
let me = null, registerMode = false, cur = null, chan = null;
let sound = localStorage.getItem('snd') !== '0';
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const ini = n => (n || '?')[0].toUpperCase();
const showErr = t => { $('msg').textContent = t; };
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }

const R = {
  heart: '<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" fill="#ff5d6c"/>',
  like: '<path d="M7 11v9H4v-9zM7 11l4-8c2 0 3 1 3 3l-1 4h6a2 2 0 0 1 2 2l-1.5 6a2 2 0 0 1-2 1.5H7z" fill="#ffc83d"/>',
  fire: '<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#ff8a3d"/>'
};
const ico = (k, s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24">' + (R[k] || '') + '</svg>';

// Синяя галочка официального аккаунта
function badge(){
  const s = el('span', 'vf');
  s.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#3d9bff"/><path d="M7.5 12.3l3 3 6-6.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return s;
}

let ac;
function beep(f){
  if (!sound) return;
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .15);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + .15);
  } catch(e) {}
}

const fakeMail = u => u + '@glaus.app';
function setMode(reg){
  registerMode = reg;
  ['phoneField', 'emailField', 'nickField'].forEach(id => $(id).style.display = reg ? 'block' : 'none');
  $('submitBtn').textContent = reg ? 'Создать аккаунт' : 'Войти';
  $('toggleBtn').textContent = reg ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
  showErr('');
}
async function submit(){
  const username = $('username').value.trim().toLowerCase();
  const password = $('password').value;
  showErr('');
  if (!/^[a-z0-9_]{3,20}$/.test(username)) { showErr('Юзернейм: 3-20 символов, латиница, цифры и _'); return; }
  if (password.length < 6) { showErr('Пароль от 6 символов'); return; }
  let res;
  if (registerMode) {
    const nickname = $('nickname').value.trim();
    if (!nickname) { showErr('Введите никнейм'); return; }
    res = await db.auth.signUp({
      email: fakeMail(username), password,
      options: { data: { username, display_name: nickname, phone: $('phone').value.trim(), contact_email: $('email').value.trim() } }
    });
  } else {
    res = await db.auth.signInWithPassword({ email: fakeMail(username), password });
  }
  if (res.error) {
    const t = res.error.message;
    if (t.includes('already') || t.includes('Database error')) showErr('Этот юзернейм уже занят');
    else if (t.includes('Invalid login')) showErr('Неверный юзернейм или пароль');
    else showErr(t);
    return;
  }
  enter();
}
async function enter(){
  const { data } = await db.auth.getSession();
  if (!data.session) { show('auth'); return; }
  const { data: p, error: pe } = await db.from('profiles').select('*').eq('id', data.session.user.id).single();
  if (!p) { await db.auth.signOut(); show('auth'); showErr('Не удалось загрузить профиль: ' + (pe ? pe.message : 'нет данных')); return; }
  me = p;
  show('app'); tab('chats'); fillSettings();
}
async function logout(){
  await db.auth.signOut();
  me = null; cur = null;
  setMode(false); show('auth');
}

function tab(n){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + n));
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.t === n));
  if (n === 'chats') loadChats();
  if (n === 'contacts') loadContacts();
}
function row(u, sub, fn){
  const r = el('div', 'row'), t = el('div', 'rt');
  const n = el('div', 'nm', u.display_name);
  if (u.verified) n.append(badge());
  t.append(n, el('div', 'ls', sub));
  r.append(el('div', 'av', ini(u.display_name)), t);
  r.onclick = fn;
  return r;
}

async function loadChats(){
  const { data: cs } = await db.from('chats').select('id,user_a,user_b').or('user_a.eq.' + me.id + ',user_b.eq.' + me.id);
  const list = $('chatList');
  list.innerHTML = '';
  if (!cs || !cs.length) { list.append(el('div', 'empty', 'Чатов пока нет. Откройте «Контакты» и выберите человека.')); return; }
  for (const c of cs) {
    const oid = c.user_a === me.id ? c.user_b : c.user_a;
    const [{ data: u }, { data: m }] = await Promise.all([
      db.from('profiles').select('*').eq('id', oid).single(),
      db.from('messages').select('body').eq('chat_id', c.id).order('created_at', { ascending: false }).limit(1)
    ]);
    if (u) list.append(row(u, m && m[0] ? m[0].body : 'Нет сообщений', () => openChat(c.id, u)));
  }
}
async function loadContacts(){
  const q = $('search').value.trim().toLowerCase();
  let r = db.from('profiles').select('*').neq('id', me.id).not('username', 'is', null).limit(50);
  if (q) r = r.ilike('username', '%' + q + '%');
  const { data } = await r;
  const list = $('contList');
  list.innerHTML = '';
  if (!data || !data.length) { list.append(el('div', 'empty', 'Никого не нашли. Попросите друга зарегистрироваться в GLAUS.')); return; }
  data.forEach(u => list.append(row(u, u.bio || '@' + u.username, () => startChat(u))));
}
async function startChat(u){
  const a = me.id, b = u.id;
  let { data: c } = await db.from('chats').select('id')
    .or('and(user_a.eq.' + a + ',user_b.eq.' + b + '),and(user_a.eq.' + b + ',user_b.eq.' + a + ')').maybeSingle();
  if (!c) {
    const r = await db.from('chats').insert({ user_a: a, user_b: b }).select('id').single();
    c = r.data;
  }
  if (c) openChat(c.id, u);
}

async function openChat(id, u){
  cur = id;
  $('chName').textContent = u.display_name;
  if (u.verified) $('chName').append(badge());
  $('chUser').textContent = u.bio || '@' + u.username;
  $('msgs').innerHTML = '';
  show('chat');
  const { data } = await db.from('messages').select('*').eq('chat_id', id).order('created_at').limit(200);
  (data || []).forEach(addMsg);
  if (chan) db.removeChannel(chan);
  chan = db.channel('c' + id).on('postgres_changes',
    { event: '*', schema: 'public', table: 'messages', filter: 'chat_id=eq.' + id },
    p => {
      if (p.eventType === 'INSERT' && !$('m' + p.new.id)) { addMsg(p.new); if (p.new.sender !== me.id) beep(660); }
      if (p.eventType === 'UPDATE') setReact(p.new);
    }).subscribe();
}
function closeChat(){
  cur = null;
  if (chan) { db.removeChannel(chan); chan = null; }
  show('app'); loadChats();
}
function addMsg(m){
  const d = el('div', 'm' + (m.sender === me.id ? ' me' : ''), m.body);
  d.id = 'm' + m.id;
  d.onclick = () => pick(m.id);
  const box = $('msgs');
  box.append(d);
  setReact(m);
  box.scrollTop = box.scrollHeight;
}
function setReact(m){
  const d = $('m' + m.id);
  if (!d) return;
  const o = d.querySelector('.rc');
  if (o) o.remove();
  if (m.reaction) {
    const r = el('span', 'rc');
    r.innerHTML = ico(m.reaction, 16);
    r.dataset.k = m.reaction;
    d.append(r);
  }
}
function pick(id){
  const old = document.querySelector('.pick');
  if (old) old.remove();
  const d = $('m' + id), p = el('div', 'pick'), has = d.querySelector('.rc');
  Object.keys(R).forEach(k => {
    const b = el('button');
    b.innerHTML = ico(k, 28);
    b.onclick = async e => {
      e.stopPropagation();
      p.remove();
      await db.from('messages').update({ reaction: has && has.dataset.k === k ? null : k }).eq('id', id);
      beep(880);
    };
    p.append(b);
  });
  d.after(p);
}
async function send(){
  const t = $('txt').value.trim();
  if (!t || !cur) return;
  $('txt').value = '';
  const { data } = await db.from('messages').insert({ chat_id: cur, body: t }).select().single();
  if (data && !$('m' + data.id)) addMsg(data);
  beep(520);
}
$('txt').onkeydown = e => { if (e.key === 'Enter') send(); };

function fillSettings(){
  $('setAv').textContent = ini(me.display_name);
  $('setName').textContent = me.display_name;
  if (me.verified) $('setName').append(badge());
  $('setUser').textContent = '@' + me.username;
  $('setNick').value = me.display_name || '';
  $('sndBtn').textContent = sound ? 'Звуки: включены' : 'Звуки: выключены';
}
async function saveNick(){
  const n = $('setNick').value.trim();
  if (!n) return;
  await db.from('profiles').update({ display_name: n }).eq('id', me.id);
  me.display_name = n;
  fillSettings();
  $('saved').textContent = 'Сохранено';
  beep(700);
}
function toggleSnd(){
  sound = !sound;
  localStorage.setItem('snd', sound ? '1' : '0');
  fillSettings();
  beep(700);
}

setMode(false);
enter();
</script>
</body>
</html>
